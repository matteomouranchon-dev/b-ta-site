<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QCM ANSSI - Cyberdéfense</title>
  <style>
    :root {
      --bg-1: #050816;
      --bg-2: #0a1026;
      --panel: rgba(7, 14, 34, 0.96);
      --panel-2: rgba(9, 20, 44, 0.96);
      --text: #e6f1ff;
      --muted: #8fb7d9;
      --cyan: #00e5ff;
      --green: #00ff9c;
      --red: #ff5c8a;
      --border: rgba(0, 229, 255, 0.25);
      --shadow: 0 0 20px rgba(0, 229, 255, 0.12), 0 0 60px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 229, 255, 0.08), transparent 22%),
        radial-gradient(circle at 80% 10%, rgba(0, 255, 156, 0.06), transparent 20%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      opacity: 0.35;
    }

    .container {
      max-width: 900px;
      margin: 24px auto;
      padding: 24px;
      background: linear-gradient(180deg, rgba(7, 14, 34, 0.95), rgba(4, 10, 24, 0.96));
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      position: relative;
      z-index: 1;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(0, 229, 255, 0.08);
      color: var(--cyan);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 {
      text-align: center;
      margin: 8px 0 10px;
      font-size: 2rem;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.2);
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .progress-wrap {
      margin: 20px 0 26px;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      border: 1px solid rgba(0, 229, 255, 0.18);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--green));
      box-shadow: 0 0 14px rgba(0,229,255,0.3);
      transition: width 0.25s ease;
    }

    .question-card {
      background: linear-gradient(180deg, rgba(8, 18, 42, 0.95), rgba(7, 14, 32, 0.95));
      border-radius: 18px;
      border: 1px solid rgba(0, 229, 255, 0.18);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02), 0 0 18px rgba(0, 229, 255, 0.05);
      padding: 22px;
      position: relative;
      overflow: hidden;
      min-height: 360px;
    }

    .question-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 6px;
      height: 100%;
      background: linear-gradient(180deg, var(--cyan), var(--green));
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.55);
    }

    .q-number {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(0,229,255,0.1);
      border: 1px solid rgba(0,229,255,0.2);
      color: var(--cyan);
      font-size: 13px;
      margin-bottom: 14px;
    }

    .question-text {
      font-size: 1.15rem;
      line-height: 1.5;
      margin-bottom: 20px;
      color: #f8fdff;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    label.option {
      display: block;
      cursor: pointer;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(143, 183, 217, 0.12);
      transition: 0.2s ease;
      color: #d8ebff;
    }

    label.option:hover {
      background: rgba(0, 229, 255, 0.08);
      border-color: rgba(0, 229, 255, 0.3);
      transform: translateX(2px);
    }

    input[type="radio"] {
      accent-color: var(--cyan);
      margin-right: 10px;
    }

    .feedback {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      display: none;
      font-size: 15px;
      border: 1px solid transparent;
    }

    .feedback.correct {
      display: block;
      background: rgba(0, 255, 156, 0.1);
      color: #9fffd5;
      border-color: rgba(0, 255, 156, 0.25);
    }

    .feedback.incorrect {
      display: block;
      background: rgba(255, 92, 138, 0.12);
      color: #ffc0d1;
      border-color: rgba(255, 92, 138, 0.25);
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    .right-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid rgba(0, 229, 255, 0.28);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      color: var(--text);
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.18), rgba(0, 255, 156, 0.12));
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.12);
      transition: 0.2s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.22);
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.28), rgba(0, 255, 156, 0.16));
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .result {
      margin-top: 28px;
      padding: 20px;
      background: linear-gradient(180deg, rgba(0, 229, 255, 0.12), rgba(0, 255, 156, 0.08));
      border: 1px solid rgba(0, 229, 255, 0.28);
      border-radius: 14px;
      display: none;
      text-align: center;
    }

    .result h2 {
      margin-top: 0;
    }

    .review {
      margin-top: 18px;
      text-align: left;
      display: grid;
      gap: 12px;
    }

    .review-item {
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .review-item strong {
      display: block;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 24px;
    }

    @media (max-width: 640px) {
      .container { margin: 14px; padding: 16px; }
      h1 { font-size: 1.6rem; }
      .question-card { padding: 18px; min-height: auto; }
      .question-text { font-size: 1.02rem; }
      .nav-buttons, .right-buttons { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Mode Cyberdéfense</div>
    <h1>QCM - ANSSI, cybersécurité et IA générative</h1>
    <p class="subtitle">Version corrigée : une seule question affichée à la fois, avec formulation plus courte et navigation simple.</p>

    <div class="progress-wrap">
      <div class="progress-head">
        <span id="counter">Question 1 / 40</span>
        <span id="scoreLive">Score : 0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="question-card" id="questionCard">
      <div class="q-number" id="qNumber">Question 1</div>
      <div class="question-text" id="questionText"></div>
      <div class="options" id="optionsContainer"></div>
      <div class="feedback" id="feedback"></div>

      <div class="nav-buttons">
        <button id="prevBtn" type="button">⬅ Précédent</button>
        <div class="right-buttons">
          <button id="resetBtn" type="button">Réinitialiser</button>
          <button id="checkBtn" type="button">Vérifier</button>
          <button id="nextBtn" type="button">Suivant ➡</button>
        </div>
      </div>
    </div>

    <div class="result" id="resultBox">
      <h2>Résultat final</h2>
      <p id="finalScore"></p>
      <button type="button" id="restartBtn">Recommencer le QCM</button>
      <div class="review" id="reviewBox"></div>
    </div>

    <p class="footer-note">Thème visuel : réseau, cybersécurité, interface tactique.</p>
  </div>

  <script>
    const questions = [
      { question: "1. Rôle du guide ANSSI sur l’IA générative ?", options: ["Vendre des outils d'IA", "Sécuriser les systèmes d’IA générative", "Remplacer les administrateurs", "Créer des jeux vidéo"], answer: 1 },
      { question: "2. Pourquoi rester prudent avec l’IA générative ?", options: ["Elle consomme trop", "Elle est illégale", "Elle crée des risques de sécurité", "Elle ne fonctionne jamais"], answer: 2 },
      { question: "3. Qui est concerné par ces recommandations ?", options: ["Seulement les collégiens", "Administrations, entreprises, organisations", "Seulement les gamers", "Seulement les développeurs web"], answer: 1 },
      { question: "4. Quel risque est lié à l’IA générative ?", options: ["La fuite de données", "La baisse de température", "L’amélioration des mots de passe", "La suppression des bugs matériels"], answer: 0 },
      { question: "5. Quelle phase appartient au cycle de vie d’une IA ?", options: ["Entraînement", "Cuisine", "Livraison", "Impression papier"], answer: 0 },
      { question: "6. Pourquoi sécuriser toutes les phases ?", options: ["Chaque phase a ses risques", "C’est plus joli", "Une seule phase suffit", "Cela réduit la taille du modèle"], answer: 0 },
      { question: "7. Pourquoi vérifier les sources des données ?", options: ["Éviter les données malveillantes", "Ralentir l’IA", "Économiser la RAM", "Supprimer l’authentification"], answer: 0 },
      { question: "8. Nom de l’attaque sur les données d’entraînement ?", options: ["Le chiffrement", "L’empoisonnement des données", "La compression", "Le hachage"], answer: 1 },
      { question: "9. Pourquoi éviter les données sensibles ?", options: ["Elles prennent trop de place", "Elles sont faciles à lire", "Elles peuvent fuiter", "Elles bloquent internet"], answer: 2 },
      { question: "10. Protéger l’intégrité des données, c’est ?", options: ["Empêcher une modification non autorisée", "Les rendre publiques", "Les imprimer", "Les supprimer"], answer: 0 },
      { question: "11. Pourquoi sécuriser la chaîne CI/CD ?", options: ["Éviter les modifications malveillantes", "Accélérer le processeur", "Changer la couleur du site", "Désactiver les sauvegardes"], answer: 0 },
      { question: "12. Pourquoi faire des audits avant la production ?", options: ["Vérifier la sécurité du système", "Allonger le projet", "Éviter la documentation", "Supprimer les tests"], answer: 0 },
      { question: "13. Cloisonner les environnements, c’est ?", options: ["Tout mettre ensemble", "Séparer test, dev et prod", "Supprimer les serveurs de test", "Laisser tous les accès ouverts"], answer: 1 },
      { question: "14. Pourquoi filtrer les entrées utilisateur ?", options: ["Éviter des manipulations ou attaques", "Afficher plus de publicités", "Bloquer le clavier", "Vider la base de données"], answer: 0 },
      { question: "15. Pourquoi filtrer les sorties de l’IA ?", options: ["Éviter des fuites d’informations", "Éteindre l’écran", "Ralentir le réseau", "Supprimer le modèle"], answer: 0 },
      { question: "16. Pourquoi journaliser les actions ?", options: ["Tracer et analyser les incidents", "Décorer le serveur", "Supprimer les utilisateurs", "Empêcher toute connexion"], answer: 0 },
      { question: "17. Pourquoi limiter les actions automatiques ?", options: ["Éviter des actions dangereuses", "Rendre l’IA plus bavarde", "Doubler les bugs", "Désactiver le réseau"], answer: 0 },
      { question: "18. Pourquoi faire une analyse de risques ?", options: ["Identifier les menaces", "Éviter le cahier des charges", "Interdire les sauvegardes", "Remplacer le RSSI"], answer: 0 },
      { question: "19. Pourquoi éviter une IA grand public avec données sensibles ?", options: ["Elle peut exposer ces données", "Elle casse l’ordinateur", "Elle marche hors ligne", "Elle bloque les mises à jour"], answer: 0 },
      { question: "20. Bonne pratique pour une IA générative ?", options: ["Donner tous les droits au modèle", "Ne jamais surveiller le système", "Appliquer le moindre privilège", "Partager les mots de passe"], answer: 2 },
      { question: "21. Que signifie ANSSI ?", options: ["Agence nationale de la sécurité des systèmes d'information", "Association numérique des services de sécurité informatique", "Agence nationale des systèmes et services internet", "Autorité nationale de surveillance des sites internet"], answer: 0 },
      { question: "22. Rôle principal de l’ANSSI ?", options: ["Vendre des antivirus", "Protéger les systèmes informatiques", "Créer des réseaux sociaux", "Réparer les PC"], answer: 1 },
      { question: "23. L’ANSSI dépend de quel pays ?", options: ["Belgique", "Canada", "France", "Suisse"], answer: 2 },
      { question: "24. Qu’est-ce qu’une cyberattaque ?", options: ["Une attaque informatique malveillante", "Une panne d’électricité", "Une mise à jour", "Un achat en ligne"], answer: 0 },
      { question: "25. Exemple de cyberattaque ?", options: ["Un écran cassé", "Virus, phishing ou ransomware", "Une impression papier", "Un redémarrage"], answer: 1 },
      { question: "26. Pourquoi mettre à jour ses logiciels ?", options: ["Corriger des failles de sécurité", "Changer le fond d’écran", "Supprimer internet", "Réduire le stockage"], answer: 0 },
      { question: "27. Qu’est-ce qu’un mot de passe sécurisé ?", options: ["Toujours le même", "Le prénom", "Long, complexe et unique", "Une date de naissance"], answer: 2 },
      { question: "28. Que signifie phishing ?", options: ["Une arnaque par email ou message", "Un logiciel de sauvegarde", "Un Wi‑Fi sécurisé", "Un pare-feu"], answer: 0 },
      { question: "29. Pourquoi éviter les Wi‑Fi publics ?", options: ["Ils sont trop rapides", "Risque de piratage", "Ils effacent les fichiers", "Ils cassent les téléphones"], answer: 1 },
      { question: "30. Qu’est-ce qu’un antivirus ?", options: ["Un jeu vidéo", "Un logiciel qui protège contre les virus", "Un câble réseau", "Un navigateur web"], answer: 1 },
      { question: "31. Pourquoi faire des sauvegardes ?", options: ["Éviter de perdre ses données", "Ralentir l’ordinateur", "Désactiver le cloud", "Partager ses fichiers"], answer: 0 },
      { question: "32. Qu’est-ce qu’un ransomware ?", options: ["Un antivirus gratuit", "Un virus qui bloque les fichiers contre rançon", "Un navigateur", "Un mot de passe à usage unique"], answer: 1 },
      { question: "33. Que faire avec un mail suspect ?", options: ["Cliquer pour vérifier", "Répondre avec son mot de passe", "Ne pas cliquer, supprimer ou signaler", "Le transférer à tout le monde"], answer: 2 },
      { question: "34. Pourquoi ne pas partager ses mots de passe ?", options: ["Éviter le piratage", "Économiser la batterie", "Accélérer la connexion", "Mieux imprimer"], answer: 0 },
      { question: "35. Qu’est-ce que l’authentification à deux facteurs ?", options: ["Deux mots de passe identiques", "Code + mot de passe", "Deux comptes email", "Deux antivirus"], answer: 1 },
      { question: "36. Pourquoi sécuriser son réseau Wi‑Fi ?", options: ["Empêcher les intrusions", "Améliorer le son", "Supprimer les cookies", "Rendre les téléchargements plus lents"], answer: 0 },
      { question: "37. Qu’est-ce qu’un hacker ?", options: ["Un pirate informatique", "Un vendeur d’ordinateurs", "Un créateur de mots de passe", "Un technicien imprimante"], answer: 0 },
      { question: "38. Mission de sensibilisation de l’ANSSI ?", options: ["Vendre des licences", "Informer et former les utilisateurs", "Créer des téléphones", "Remplacer les professeurs"], answer: 1 },
      { question: "39. Pourquoi protéger ses données personnelles ?", options: ["Éviter le vol d’identité", "Gagner de la RAM", "Accélérer les mises à jour", "Rendre le Wi‑Fi public"], answer: 0 },
      { question: "40. Bonne pratique en cybersécurité ?", options: ["Partager ses mots de passe", "Utiliser un mot de passe fort", "Ouvrir tous les liens", "Désactiver les mises à jour"], answer: 1 }
    ];

    let currentQuestion = 0;
    const userAnswers = new Array(questions.length).fill(null);
    const validated = new Array(questions.length).fill(false);
    let score = 0;

    const qNumber = document.getElementById('qNumber');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedback = document.getElementById('feedback');
    const counter = document.getElementById('counter');
    const progressFill = document.getElementById('progressFill');
    const scoreLive = document.getElementById('scoreLive');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const checkBtn = document.getElementById('checkBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultBox = document.getElementById('resultBox');
    const finalScore = document.getElementById('finalScore');
    const reviewBox = document.getElementById('reviewBox');
    const restartBtn = document.getElementById('restartBtn');
    const questionCard = document.getElementById('questionCard');

    function renderQuestion() {
      const q = questions[currentQuestion];
      qNumber.textContent = `Question ${currentQuestion + 1}`;
      counter.textContent = `Question ${currentQuestion + 1} / ${questions.length}`;
      questionText.textContent = q.question;
      optionsContainer.innerHTML = '';
      feedback.className = 'feedback';
      feedback.style.display = 'none';
      feedback.textContent = '';

      q.options.forEach((option, index) => {
        const label = document.createElement('label');
        label.className = 'option';
        label.innerHTML = `<input type="radio" name="question" value="${index}"> ${option}`;
        optionsContainer.appendChild(label);
      });

      if (userAnswers[currentQuestion] !== null) {
        const selected = optionsContainer.querySelector(`input[value="${userAnswers[currentQuestion]}"]`);
        if (selected) selected.checked = true;
      }

      if (validated[currentQuestion]) {
        const isCorrect = userAnswers[currentQuestion] === q.answer;
        feedback.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
        feedback.style.display = 'block';
        feedback.textContent = isCorrect
          ? `Bonne réponse : ${q.options[q.answer]}`
          : `Incorrect. Bonne réponse : ${q.options[q.answer]}`;
      }

      prevBtn.disabled = currentQuestion === 0;
      nextBtn.textContent = currentQuestion === questions.length - 1 ? 'Terminer ✅' : 'Suivant ➡';
      updateProgress();
    }

    function updateProgress() {
      const done = validated.filter(Boolean).length;
      progressFill.style.width = `${(done / questions.length) * 100}%`;
      scoreLive.textContent = `Score : ${score}`;
    }

    function checkAnswer() {
      const selected = document.querySelector('input[name="question"]:checked');
      const q = questions[currentQuestion];

      if (!selected) {
        feedback.className = 'feedback incorrect';
        feedback.style.display = 'block';
        feedback.textContent = '⚠️ Tu dois choisir une réponse.';
        return;
      }

      const value = Number(selected.value);
      const alreadyValidated = validated[currentQuestion];
      const previousWasCorrect = userAnswers[currentQuestion] === q.answer;

      userAnswers[currentQuestion] = value;
      validated[currentQuestion] = true;

      if (!alreadyValidated && value === q.answer) score++;
      if (alreadyValidated && previousWasCorrect && value !== q.answer) score--;
      if (alreadyValidated && !previousWasCorrect && value === q.answer) score++;

      const isCorrect = value === q.answer;

      // Mise en évidence visuelle des réponses
      const allOptions = document.querySelectorAll('input[name="question"]');
      allOptions.forEach((input) => {
        const label = input.parentElement;
        label.style.border = "1px solid rgba(255,255,255,0.08)";
        label.style.background = "rgba(255,255,255,0.02)";

        if (Number(input.value) === q.answer) {
          label.style.border = "1px solid rgba(0,255,156,0.6)";
          label.style.background = "rgba(0,255,156,0.12)";
        }

        if (input.checked && Number(input.value) !== q.answer) {
          label.style.border = "1px solid rgba(255,92,138,0.6)";
          label.style.background = "rgba(255,92,138,0.15)";
        }
      });

      // Feedback amélioré
      feedback.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
      feedback.style.display = 'block';

      if (isCorrect) {
        feedback.innerHTML = `✅ Bonne réponse !<br><strong>${q.options[q.answer]}</strong>`;
      } else {
        feedback.innerHTML = `❌ Mauvaise réponse.<br><strong>Bonne réponse :</strong> ${q.options[q.answer]}`;
      }

      updateProgress();
    }

    function resetCurrent() {
      const q = questions[currentQuestion];
      if (validated[currentQuestion] && userAnswers[currentQuestion] === q.answer) score--;
      userAnswers[currentQuestion] = null;
      validated[currentQuestion] = false;
      renderQuestion();
    }

    function nextQuestion() {
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion();
      } else {
        showResults();
      }
    }

    function previousQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
      }
    }

    function showResults() {
      questionCard.style.display = 'none';
      resultBox.style.display = 'block';
      finalScore.textContent = `Tu as obtenu ${score} / ${questions.length}.`;
      reviewBox.innerHTML = '';

      questions.forEach((q, i) => {
        const div = document.createElement('div');
        div.className = 'review-item';
        const user = userAnswers[i] !== null ? q.options[userAnswers[i]] : 'Aucune réponse';
        const good = q.options[q.answer];
        div.innerHTML = `<strong>${q.question}</strong>Ta réponse : ${user}<br>Correction : ${good}`;
        reviewBox.appendChild(div);
      });
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      for (let i = 0; i < questions.length; i++) {
        userAnswers[i] = null;
        validated[i] = false;
      }
      resultBox.style.display = 'none';
      questionCard.style.display = 'block';
      renderQuestion();
    }

    prevBtn.addEventListener('click', previousQuestion);
    nextBtn.addEventListener('click', nextQuestion);
    checkBtn.addEventListener('click', checkAnswer);
    resetBtn.addEventListener('click', resetCurrent);
    restartBtn.addEventListener('click', restartQuiz);

    renderQuestion();
  </script>
</body>
</html>
